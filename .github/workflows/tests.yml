name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bronze (extract + load)
        run: python -c "from etl import bronze; from etl.config import BRUTA, BENEFICIADA; bronze.run_bronze(BRUTA); bronze.run_bronze(BENEFICIADA)"

      - name: dbt build (staging + marts + schema tests)
        run: |
          mkdir -p data/warehouse
          dbt build --project-dir transform --profiles-dir transform
        env:
          BATEIA_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/bateia.duckdb
          BATEIA_DATA_DIR: ${{ github.workspace }}/data

      - name: Python tests (Bronze + dashboard build)
        run: pytest tests/ -v

      - name: Build dashboard
        run: python -c "from dashboard.build_dashboard import build_dashboard; build_dashboard()"

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: output/dashboard.html
